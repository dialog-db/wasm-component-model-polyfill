on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

name: 'Test'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job names its runner image rather than `ubuntu-latest`, so a new
# Ubuntu (and its AppArmor rules, which headless Chrome depends on) arrives
# by a deliberate change here, not on GitHub's migration date.
#
# Every job also sets a time limit under GitHub's six-hour maximum, with
# room for a run with a cold binary cache. The lint and test steps run
# under `.github/scripts/watch-runner.sh`, which prints free disk and
# memory to the log as the step runs and fails the step, naming the
# largest directories, before a full disk can stall the runner.
jobs:
  lint_nix:
    name: 'Lint Nix'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/flake-checker-action@v14
        with:
          send-statistics: false
          ignore-missing-flake-lock: false

  # Every check the flake declares (`nix flake check`), in the `ci` shell,
  # which leaves out the sandbox commands and so the guest VM. `-L` puts
  # each build's output in the log; `--keep-going` runs every check after
  # one fails.
  lint:
    name: 'Lint'
    needs: ['lint_nix']
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 300
    env:
      HAS_CACHIX_TOKEN: '${{ secrets.CACHIX_AUTH_TOKEN != '''' }}'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare-runner
      - name: 'Run lints'
        shell: bash
        run: |
          .github/scripts/watch-runner.sh \
            nix develop --accept-flake-config .#ci --command lint -L --keep-going
      # Whatever the step above built, even when it failed, so the next
      # run reuses it. Only where the secret exists: a pull request from a
      # fork has no token and pushes nothing.
      - name: 'Push to the binary cache'
        if: always() && env.HAS_CACHIX_TOKEN == 'true'
        shell: bash
        env:
          CACHIX_AUTH_TOKEN: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        run: |
          nix develop --accept-flake-config .#ci --command cache push --yes

  # The lanes of `tests all`, grouped by the archive they replay, so that
  # each archive is built once. The Zena lane builds both debug archives
  # itself. The test jobs wait for `lint`, so a run that fails it spends no
  # runner time on tests.
  tests:
    name: 'Tests (${{ matrix.name }})'
    needs: ['lint']
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 240
    env:
      HAS_CACHIX_TOKEN: '${{ secrets.CACHIX_AUTH_TOKEN != '''' }}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'native debug'
            lanes: |
              native debug
              native no-provider
              native wasmi
              fidelity wasmi
              fidelity wasmtime
          - name: 'native release'
            lanes: |
              native release
          - name: 'web debug'
            lanes: |
              web debug
              web no-provider
              fidelity web
          - name: 'web release'
            lanes: |
              web release
          - name: 'zena'
            lanes: |
              zena
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare-runner
      # Every lane runs even after one fails, as `tests all` does.
      - name: 'Run test lanes'
        shell: bash
        env:
          LANES: '${{ matrix.lanes }}'
        run: |
          status=0
          while read -r lane; do
            [ -n "$lane" ] || continue
            started=$SECONDS
            echo "::group::tests $lane"
            # shellcheck disable=SC2086
            if .github/scripts/watch-runner.sh \
              nix develop --accept-flake-config .#ci --command tests $lane; then
              echo "::endgroup::"
              echo "tests $lane: passed in $((SECONDS - started))s"
            else
              echo "::endgroup::"
              echo "::error title=tests $lane::failed after $((SECONDS - started))s"
              status=1
            fi
          done <<< "$LANES"
          exit "$status"
      # Whatever the step above built, even when it failed, so the next
      # run reuses it. Only where the secret exists: a pull request from a
      # fork has no token and pushes nothing.
      - name: 'Push to the binary cache'
        if: always() && env.HAS_CACHIX_TOKEN == 'true'
        shell: bash
        env:
          CACHIX_AUTH_TOKEN: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        run: |
          nix develop --accept-flake-config .#ci --command cache push --yes

  # The one status a branch protection rule needs to require.
  ci:
    name: 'CI'
    if: always()
    needs: ['lint_nix', 'lint', 'tests']
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 5
    steps:
      - name: 'Require every job to pass'
        env:
          RESULTS: '${{ join(needs.*.result, '' '') }}'
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
