name: 'Prepare runner'
description: 'Frees disk, installs Nix with the project binary cache, and moves scratch space onto the Nix volume'

runs:
  using: 'composite'
  steps:
    # NOTE: AppArmor became more restrictive in Ubuntu 24.04 and gets in
    # the way of headless Chrome; it should be safe to disable it.
    # SEE: https://github.com/NixOS/nixpkgs/issues/121694#issuecomment-2159420924
    # SEE: https://github.com/actions/runner-images/issues/10015
    - uses: cisagov/action-disable-apparmor@v1

    # Removes the runner's large preinstalled packages up front, so that
    # nothing-but-nix below starts from more free space. The preinstalled
    # language runtimes stay, and so does swap: without it a job under
    # memory pressure is killed with no error that names the cause.
    - name: 'Free disk space'
      uses: jlumbroso/free-disk-space@v2.0.0
      with:
        preinstalled-runtimes: false

    # nothing-but-nix makes its first /nix volume out of the free space
    # on /mnt, all but mnt-safe-haven of it, and only later grows /nix
    # into what purging frees on /, beyond root-safe-haven. Where /mnt is
    # its own disk, that leaves root-safe-haven on /. Where /mnt is on the
    # root filesystem, as on the current images, the first volume takes
    # nearly all of / and root-safe-haven never applies; a 16GB
    # mnt-safe-haven (at most a third of the free space, so the action's
    # own size check passes) keeps that much on / from the start. The
    # step prints both filesystems so a log shows which layout ran.
    - name: 'Size the safe havens'
      id: havens
      shell: bash
      run: |
        df -h / /mnt
        if [ "$(df --output=source / | tail -n 1)" = "$(df --output=source /mnt | tail -n 1)" ]; then
          free=$(df -m --output=avail / | tail -n 1 | tr -d ' ')
          haven=$(( free / 3 < 16384 ? free / 3 : 16384 ))
          echo "/mnt is on the root filesystem: mnt-safe-haven ${haven}MB"
        else
          haven=1024
          echo "/mnt is its own filesystem: mnt-safe-haven ${haven}MB"
        fi
        echo "mnt=$haven" >> "$GITHUB_OUTPUT"

    # Reclaims the rest of the runner as one large /nix volume, leaving
    # root-safe-haven (40GB) on the root filesystem when purging frees
    # that much: some test runs leave build artifacts there, under $HOME
    # and the runner's temp space, that nothing redirects onto /nix. A
    # full root filesystem stalls the runner rather than failing the job.
    - uses: wimpysworld/nothing-but-nix@v10
      with:
        root-safe-haven: '40960'
        mnt-safe-haven: '${{ steps.havens.outputs.mnt }}'

    # Nix builds under /nix/build, on the large volume, rather than /tmp.
    # One derivation at a time: each cargo build already uses every core,
    # and two at once can exhaust the runner's 16GB, as they do in a
    # sandbox VM of the same size. A build that prints nothing for half an
    # hour, or runs for three, is stopped and named in the log rather than
    # holding the job until its time limit.
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          build-dir = /nix/build
          max-jobs = 1
          max-silent-time = 1800
          timeout = 10800

    # Pull only. A job pushes in its last step, with the `cache push` menu
    # command: this action's push filter keeps a matching path from being
    # pushed by name, but Cachix uploads every pushed path's closure, so
    # pushing the sandbox check uploaded the guest and Claude Code with it.
    # `cache push` leaves out the test archives, Claude Code, and every
    # path whose closure holds one of them.
    - uses: cachix/cachix-action@v17
      with:
        name: wcmp
        skipPush: true

    # A test lane extracts its archive and starts its browsers under
    # $XDG_CACHE_HOME, which would otherwise be on the root filesystem.
    - name: 'Move scratch space onto the Nix volume'
      shell: bash
      run: |
        sudo mkdir -p /nix/scratch
        sudo chown "$(id --user):$(id --group)" /nix/scratch
        echo "XDG_CACHE_HOME=/nix/scratch" >> "$GITHUB_ENV"
