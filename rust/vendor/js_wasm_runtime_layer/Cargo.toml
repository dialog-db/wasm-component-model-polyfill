# Vendored from crates.io `js_wasm_runtime_layer` 0.7.0 with the patches
# listed in PATCHES.md. The workspace routes the registry name here through
# `[patch.crates-io]`; the crate is excluded from the workspace so it keeps
# its own dependency table.
[package]
edition = "2021"
name = "js_wasm_runtime_layer"
version = "0.7.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = """
WebAssembly runtime compatibility interface implementation for your web browser's WebAssembly runtime.
"""
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DouglasDwyer/wasm_runtime_layer"

[features]
default = ["std"]
std = [
    "anyhow/std",
    "wasm_runtime_layer/std",
]
tracing = ["dep:tracing"]

[lib]
name = "js_wasm_runtime_layer"
path = "src/lib.rs"

[dependencies.anyhow]
version = "1.0"
default-features = false

[dependencies.fxhash]
version = "0.2"
default-features = false

[dependencies.js-sys]
version = "0.3"
default-features = false

[dependencies.slab]
version = "0.4"
default-features = false

[dependencies.smallvec]
version = "1.11"
default-features = false

[dependencies.tracing]
version = "0.1"
optional = true
default-features = false

[dependencies.wasm-bindgen]
version = "0.2"
default-features = false

# PATCH (wcmp): asynchronous compilation through `WebAssembly.compile`.
[dependencies.wasm-bindgen-futures]
version = "0.4"
default-features = false

[dependencies.wasm_runtime_layer]
version = "0.7"
default-features = false

[dependencies.wasmparser]
version = "0.244"
features = ["std"]
default-features = false
