[package]
name = "wcmp-smoke"
description = "One host program that walks the polyfill end to end, natively and in the browser"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
publish = false

[dependencies]
wasm-component-model-polyfill = { workspace = true }
wcmp-macros = { workspace = true }
# `wasmparser` finds the `thread.yield` built-in whose `cancellable`
# immediate the cancelled-thread story sets: the text format no longer
# spells the immediate, so the component is assembled without it.
wasmparser = { workspace = true }

# `time` supplies the timer the `run_concurrent` step waits on: the
# entry has to be pending on something the store cannot resolve, and
# the executor's own timer is that on this target.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time"] }

# The browser half of the same wait is a `setTimeout`-backed promise,
# reached through the global the way the polyfill's own yield wake
# reaches it, so it works on a page and in a worker alike. The same
# crates read the global `WebAssembly` namespace to learn whether the
# browser ships JavaScript Promise Integration.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
