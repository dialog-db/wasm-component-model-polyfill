<!doctype html>
<meta charset="utf-8" />
<!--
  The page holds itself to the content-security policy a hardened site
  would set: script only from this origin, and `'wasm-unsafe-eval'` for
  the module, with no `'unsafe-eval'`. The polyfill and the browser
  backend it vendors must instantiate a composition under exactly this
  much, so the page's own script lives in `boot.js` rather than inline,
  and `boot.js` records whether the browser is enforcing the policy for
  `check.py` to read.
-->
<meta
  http-equiv="Content-Security-Policy"
  content="script-src 'self' 'wasm-unsafe-eval'"
/>
