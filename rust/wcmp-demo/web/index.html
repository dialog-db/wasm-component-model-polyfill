<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Zena TodoMVC · Wasm Component Model Polyfill</title>
    <link data-trunk rel="css" href="style.css" />
    <!--
      The custom element classes, which Rust cannot write. A classic
      script runs before Trunk's module, so the page's Rust finds
      `demoElements` when it defines the first element.
    -->
    <script src="elements.js"></script>
    <link data-trunk rel="copy-file" href="elements.js" />
    <link data-trunk rel="copy-file" href="sw.js" />
    <link
      data-trunk
      rel="rust"
      href="../Cargo.toml"
      data-bin="wcmp-demo-page"
      data-wasm-opt="0"
    />
    <link
      data-trunk
      rel="rust"
      href="../Cargo.toml"
      data-bin="wcmp-demo-worker"
      data-type="worker"
      data-wasm-opt="0"
    />
  </head>
  <body>
    <main id="app">
      <!--
        The application. The page defines <todo-app> once it has compiled
        the elements and the service worker controls the page. Until then,
        and until the element's list has loaded, the element shows this
        spinner.
      -->
      <todo-app>
        <div class="loading" role="progressbar" aria-label="Loading">
          <div class="spinner" aria-hidden="true"></div>
        </div>
      </todo-app>
      <!--
        The spinner only turns, by the Web Animations API. A turn of an HTML
        element runs on the browser's compositor, so it stays smooth while
        the page compiles on its main thread. A CSS animation would restart
        when the element moves the spinner into a slot of its shadow root.
      -->
      <script>
        document
          .querySelector("todo-app .spinner")
          .animate([{ transform: "rotate(0turn)" }, { transform: "rotate(1turn)" }], {
            duration: 900,
            iterations: Infinity,
          });
      </script>
    </main>
  </body>
</html>
