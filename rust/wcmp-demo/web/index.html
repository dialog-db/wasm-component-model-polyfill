<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Zena TodoMVC · Wasm Component Model Polyfill</title>
    <link data-trunk rel="css" href="style.css" />
    <!--
      The custom element classes, which Rust cannot write. A classic
      script runs before Trunk's module, so the page's Rust finds
      `demoElements` when it defines the first element.
    -->
    <script src="elements.js"></script>
    <link data-trunk rel="copy-file" href="elements.js" />
    <link data-trunk rel="copy-file" href="sw.js" />
    <link
      data-trunk
      rel="rust"
      href="../Cargo.toml"
      data-bin="wcmp-demo-page"
      data-wasm-opt="0"
    />
    <link
      data-trunk
      rel="rust"
      href="../Cargo.toml"
      data-bin="wcmp-demo-worker"
      data-type="worker"
      data-wasm-opt="0"
    />
  </head>
  <body>
    <main id="app">
      <!--
        The skeleton: a gray placeholder in the shape of the todo list,
        until the page has compiled the elements and mounts <todo-app>.
      -->
      <div class="skeleton" aria-busy="true" aria-label="Loading">
        <div class="skeleton-title"></div>
        <div class="skeleton-field"></div>
        <div class="skeleton-row"></div>
        <div class="skeleton-row"></div>
        <div class="skeleton-row"></div>
      </div>
    </main>
    <footer class="colophon">
      <p>
        Double-click a todo to edit it. Every part of this page is a
        <a href="https://component-model.bytecodealliance.org/">component</a>
        the browser compiled from <a href="https://zena-lang.dev/">Zena</a>
        source, running on the Wasm Component Model Polyfill.
      </p>
    </footer>
  </body>
</html>
