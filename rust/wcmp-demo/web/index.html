<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Zena TodoMVC · Wasm Component Model Polyfill</title>
    <link data-trunk rel="css" href="style.css" />
    <!--
      The custom element classes, which Rust cannot write. A classic
      script runs before Trunk's module, so the page's Rust finds
      `demoElements` when it defines the first element.
    -->
    <script src="elements.js"></script>
    <link data-trunk rel="copy-file" href="elements.js" />
    <link data-trunk rel="copy-file" href="sw.js" />
    <link
      data-trunk
      rel="rust"
      href="../Cargo.toml"
      data-bin="wcmp-demo-page"
      data-wasm-opt="0"
    />
    <link
      data-trunk
      rel="rust"
      href="../Cargo.toml"
      data-bin="wcmp-demo-worker"
      data-type="worker"
      data-wasm-opt="0"
    />
  </head>
  <body>
    <main id="app">
      <!--
        The application. The page defines <todo-app> once it has compiled
        the elements and the service worker controls the page. Until then,
        and until the element's list has loaded, the element shows this
        spinner.
      -->
      <todo-app>
        <div class="loading" role="progressbar" aria-label="Loading">
          <svg class="spinner" viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="24" cy="24" r="20" />
          </svg>
        </div>
      </todo-app>
      <!--
        The spinner turns by the Web Animations API, not by CSS animations:
        the element moves the spinner into slots of its shadow root, which
        restarts a CSS animation, and a restart shows as a jump.
      -->
      <script>
        (() => {
          const spinner = document.querySelector("todo-app .spinner");
          const forever = { duration: 1400, iterations: Infinity };
          spinner.animate(
            [{ transform: "rotate(0deg)" }, { transform: "rotate(360deg)" }],
            forever,
          );
          spinner.firstElementChild.animate(
            [
              { strokeDasharray: "1 126", strokeDashoffset: 0, easing: "ease-in-out" },
              { strokeDasharray: "90 126", strokeDashoffset: -35, easing: "ease-in-out" },
              { strokeDasharray: "90 126", strokeDashoffset: -124 },
            ],
            forever,
          );
        })();
      </script>
    </main>
    <footer class="colophon">
      <p>
        Every part of this page is a
        <a href="https://component-model.bytecodealliance.org/">component</a>
        the browser compiled from <a href="https://zena-lang.dev/">Zena</a>
        source, running on the Wasm Component Model Polyfill.
      </p>
    </footer>
  </body>
</html>
