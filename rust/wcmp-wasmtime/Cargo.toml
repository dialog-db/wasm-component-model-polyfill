[package]
name = "wcmp-wasmtime"
description = "The Wasmtime run of the toolchain compatibility scenarios: each compiled scenario through Wasmtime's component API, written out as observations"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
publish = false

# Wasmtime does not run in the browser, so the run is native only. On
# `wasm32-unknown-unknown` the library is empty and the binary does
# nothing, which keeps the workspace building for the web lanes.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
wcmp-scenario = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
wcmp-macros = { workspace = true }
