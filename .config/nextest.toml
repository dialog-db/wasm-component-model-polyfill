# Every conformance corpus file is two tests: `it_passes_<file>` runs
# it with the suspend provider allowed, and
# `it_passes_<file>::it_passes_without_a_provider` runs it with the
# provider turned off through `EngineConfig` (see
# `rust/wcmp/tests/conformance.rs`). The
# profiles split the two states into their own lanes. A filterset on
# the command line narrows a profile's default filter rather than
# replacing it; `--ignore-default-filter` drops it.

# The ordinary lanes (`tests native|web <profile>`): every test, with
# the conformance corpus in its provider-allowed state. Only the corpus
# tests leave their provider-off twin to its lane: a test elsewhere whose
# name ends the same way builds its own engine with the provider off, and
# runs here like any other. The Zena test
# that holds all three subjects to the record reads the browser's run
# from a file, so only `tests zena` runs it. The fidelity suite of
# each backend of the runtime layer runs in its own lane.
[profile.default]
default-filter = "not (binary(conformance) and test(/without_a_provider$/)) and not (binary(zena) and test(=it_holds_every_subject_to_the_record_and_prints_the_report)) and not binary(fidelity)"
# A test that hangs fails its lane with its name instead of stalling it.
# nextest names a test SLOW after each minute and kills it after ten,
# and the lane reports it as TIMEOUT. Every other profile inherits this,
# so the limit holds on every native lane, debug and release, and on the
# Zena lane. The slowest tests today, the conformance progress report
# and the Wasmi lane's memory hogs, take under a minute natively, so ten
# minutes leaves room for a loaded CI runner without letting a hang hold
# a lane for long.
#
# A browser test is bounded sooner: the `wbg-pool` daemon gives up on a
# tab after `WASM_BINDGEN_TEST_TIMEOUT` seconds (180, set by the dev
# shell), reads what output the page wrote, and fails the test with "test
# run timed out". The daemon keeps that clock outside the page, so it
# fires even when a guest spins and the page's own timers never run.
# The ten-minute limit stays behind it in case the runner itself wedges.
# The demo lane does not run through nextest; every WebDriver command it
# sends is bounded to three minutes (`rust/wcmp-demo-lane`).
slow-timeout = { period = "60s", terminate-after = 10 }

# The Wasmi lane (`tests native wasmi`): the default profile's tests on
# the Wasmi backend. The corpus files Wasmtime's runner marks
# `;;! hogs_memory = true`, and the progress test, which runs every file
# in one process, each hold memories of several GiB there:
# `wasmtime/memory64.wast` declares one of 65538 pages, and
# `wasmtime/big-strings.wast` grows each fresh instance by 65530. Wasmi
# commits a memory's pages as it grows (it zero-fills a `Vec`), so it
# holds all of it, 4 to 5 GiB for either file. They run one at a time,
# beside the other tests, so no two of them hold such a memory together.
# Wasmtime reserves the address space and commits only what a test
# touches, so on Wasmtime and in the browser none of them is a hog.
[test-groups]
memory-hogs = { max-threads = 1 }

[profile.wasmi]

[[profile.wasmi.overrides]]
filter = "binary(conformance) and (test(/^it_passes_wasmtime_(big_strings|memory64)(::|$)/) or test(/^it_reports_conformance_progress/))"
test-group = "memory-hogs"

# The `no-provider` lanes (`tests native|web no-provider`): the
# conformance corpus alone, with the provider turned off.
[profile.no-provider]
default-filter = "binary(conformance) and test(/::it_passes_without_a_provider$/)"

# The fidelity lanes (`tests fidelity <backend>`): the
# specification test suite on one backend, one test per script, which
# the menu command narrows to the backend's own test binary. The report
# of the suite of every script is printed after the run.
[profile.fidelity]
default-filter = "binary(fidelity)"

[[profile.fidelity.overrides]]
filter = "test(=it_reports_the_suite_of_each_script)"
success-output = "final"
