[workspace]
members = [
  "rust/wasm-component-model-polyfill",
  "rust/wcmp-bench",
  "rust/wcmp-macros",
  "rust/wcmp-smoke",
]
# Each vendored backend keeps its own dependency table (it is upstream's
# crate with local patches), so neither is a member.
exclude = [
  "rust/vendor/js_wasm_runtime_layer",
  "rust/vendor/wasmtime_runtime_layer",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["The Wasm Component Model Polyfill Authors"]
license = "MIT OR Apache-2.0"
edition = "2024"
repository = "https://github.com/cdata/wasm-component-model-polyfill"

[workspace.dependencies]
anyhow = "1"
js-sys = "0.3"
proc-macro2 = "1"
quote = "1"
semver = "1"
syn = { version = "2", features = ["full"] }
thiserror = "2"
tokio = "1"
# Pinned so that the crate version everything links against matches the
# `wasm-bindgen-cli` the flake provides and the codegen library inside
# `wbg-pool`, the browser test runner the flake pins by commit. The two move
# together: the runner refuses a test binary built by another version.
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
wasm_runtime_layer = "0.7"
wast = "259"
# Wasmtime 49 removed the rule that compiled a fused adapter between a lift
# and a lower of one component instance to an unconditional trap. 49 is a
# release candidate on crates.io; the pin moves to the stable release when it
# publishes.
wasmtime = "=49.0.0-rc.1"
wasmtime-environ = { version = "=49.0.0-rc.1", default-features = false, features = ["component-model"] }
# The Wasmtime backend of the runtime layer has no 49 release. The version
# requirement stays at the vendored crate's own 48, which the patch below
# redirects to a copy built against Wasmtime 49.
wasmtime_runtime_layer = "48"
js_wasm_runtime_layer = "0.7"
wat = "1"

[workspace.dependencies.wasm-component-model-polyfill]
path = "./rust/wasm-component-model-polyfill"

[workspace.dependencies.wcmp-macros]
path = "./rust/wcmp-macros"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[profile.wasm-release]
inherits = "release"
opt-level = "s"
debug = 0
strip = "debuginfo"

# Both backends of the runtime layer are vendored: the browser one patched for
# memory and global imports and for host error propagation, the Wasmtime one
# patched to build against Wasmtime 49. See the PATCHES.md beside each.
[patch.crates-io]
js_wasm_runtime_layer = { path = "rust/vendor/js_wasm_runtime_layer" }
wasmtime_runtime_layer = { path = "rust/vendor/wasmtime_runtime_layer" }
