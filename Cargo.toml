[workspace]
members = [
  "rust/wcmp",
  "rust/wcmp-bench",
  "rust/wcmp-bindgen",
  "rust/wcmp-bindgen-tests",
  "rust/wcmp-demo",
  "rust/wcmp-demo-lane",
  "rust/wcmp-macros",
  "rust/wcmp-scenario",
  "rust/wcmp-scenario-wasmtime",
  "rust/wcmp-smoke",
  "rust/wcmp-wasm-core",
  "rust/wcmp-wasm-core-contract",
  "rust/wcmp-wasm-core-fidelity",
  "rust/wcmp-wasm-core-wasmi",
  "rust/wcmp-wasm-core-wasmtime",
  "rust/wcmp-wasm-core-web",
]
resolver = "2"

[workspace.package]
version = "0.1.2"
authors = ["The Wasm Component Model Polyfill Authors"]
license = "MPL-2.0"
edition = "2024"
repository = "https://github.com/dialog-db/wasm-component-model-polyfill"

[workspace.dependencies]
anyhow = "1"
# The Rust names of WIT names in the code `wcmp::bindgen!` writes, as
# Wasmtime's generator spells them. The version is the one Wasmtime's own
# generator already links, so the graph keeps one.
heck = "0.5"
# The demo's async plumbing: a lock that waits, channels, and a set of
# futures that a store's driver polls together.
futures = "0.3"
# Without its default `unsafe-eval` feature, which turns on `eval` and the
# `Function` constructors: the polyfill and the browser backend run under a
# Content Security Policy that refuses both, and use neither.
js-sys = { version = "0.3", default-features = false, features = ["std"] }
proc-macro2 = "1"
quote = "1"
semver = "1"
# The demo lane's WebDriver messages, which are JSON.
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full"] }
thiserror = "2"
tokio = "1"
# The spans and events of the polyfill, the runtime layer, and the demo.
# Nothing records them until an application installs a subscriber. The
# `attributes` feature brings `#[instrument]`; the default `std` stays.
tracing = { version = "0.1", features = ["attributes"] }
# The demo's subscriber: a registry with a console layer and a performance
# layer, each with its own level filter.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }
# The demo's browser layers: spans as performance marks and measures, which
# the browser's performance panel draws, and events in the console.
tracing-web = "0.1.3"
# Pinned so that the crate version everything links against matches the
# `wasm-bindgen-cli` the flake provides and the codegen library inside
# `wbg-pool`, the browser test runner the flake pins by commit. The two move
# together: the runner refuses a test binary built by another version.
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
# The browser API the demo drives: the DOM, custom elements, the service
# worker, `fetch`, and IndexedDB. Each crate names the features it uses.
web-sys = "0.3"
# Encodes the switch module the polyfill generates for each store. The
# version is the one `wasmtime-environ` already links, so the graph keeps one.
wasm-encoder = { version = "0.261", default-features = false, features = ["std"] }
# The parser that the runtime layer and the translator read core and
# component binaries with. The version is the one `wasmtime-environ` already
# links, so the graph keeps one.
wasmparser = { version = "0.261", default-features = false, features = ["std", "component-model"] }
wast = "262"
# The engine of the Wasmi backend of the runtime layer, at the current
# major version. Nothing else in the graph must agree with it: Wasmi links
# its own `wasmparser`. The backend turns off the default features, which
# add the text format to `Module::new`, and names each one it needs.
wasmi = { version = "2", default-features = false }
# The polyfill takes its fused adapters, its trampolines, and the start-call
# protocol from Wasmtime 50, so the floor is 50. The requirements are
# carets. Wasmtime pins its own crates to each other exactly, so an exact
# `wasmtime-environ` here would keep a consumer on that one patch release of
# `wasmtime`.
wasmtime = "50.0.0"
wasmtime-environ = { version = "50.0.0", default-features = false, features = ["component-model"] }
# The WASI imports of the Wasmtime run of the toolchain compatibility
# scenarios. It moves with `wasmtime`: one Wasmtime runs the scenarios,
# and it is this workspace's. Only the p2 and p3 interfaces are linked.
wasmtime-wasi = { version = "50.0.0", default-features = false, features = ["p2", "p3"] }
wat = "1"
# The WIT parser `wcmp::bindgen!` reads WIT with, at compile time on the
# build machine. The version is the one Wasmtime 50's generator links, so
# the graph keeps one.
wit-parser = "0.261"

[workspace.dependencies.wcmp]
path = "./rust/wcmp"

[workspace.dependencies.wcmp-bindgen]
path = "./rust/wcmp-bindgen"
# The polyfill re-exports the macro, so a published polyfill depends on the
# published macro, and the path carries the version too. It moves with the
# workspace version.
version = "0.1.2"

[workspace.dependencies.wcmp-macros]
path = "./rust/wcmp-macros"
# The browser backend runs these macros when it builds, so a published backend
# depends on the published macros, and the path carries the version too. It
# moves with the workspace version.
version = "0.1.2"

[workspace.dependencies.wcmp-scenario]
path = "./rust/wcmp-scenario"

[workspace.dependencies.wcmp-wasm-core]
path = "./rust/wcmp-wasm-core"
# A published backend depends on the published runtime layer, so the path
# carries the version too. It moves with the workspace version.
version = "0.1.2"

[workspace.dependencies.wcmp-wasm-core-contract]
path = "./rust/wcmp-wasm-core-contract"

[workspace.dependencies.wcmp-wasm-core-fidelity]
path = "./rust/wcmp-wasm-core-fidelity"

[workspace.dependencies.wcmp-wasm-core-wasmi]
path = "./rust/wcmp-wasm-core-wasmi"
# The polyfill's own unit tests hand their engines this backend, and Cargo
# keeps a dev-dependency in a published package only when it has a version,
# so the path carries the version too. It moves with the workspace version.
version = "0.1.2"

[workspace.dependencies.wcmp-wasm-core-wasmtime]
path = "./rust/wcmp-wasm-core-wasmtime"
# The polyfill's own unit tests hand their engines this backend, and Cargo
# keeps a dev-dependency in a published package only when it has a version,
# so the path carries the version too. It moves with the workspace version.
version = "0.1.2"

[workspace.dependencies.wcmp-wasm-core-web]
path = "./rust/wcmp-wasm-core-web"
# The polyfill's own unit tests hand their engines this backend, and Cargo
# keeps a dev-dependency in a published package only when it has a version,
# so the path carries the version too. It moves with the workspace version.
version = "0.1.2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Wasmi picks its tail-call dispatch at every optimizing level, and its debug
# assertions keep LLVM from turning that dispatch into tail calls, so a long
# run overflows the native stack (wasmi-labs/wasmi#2039). The dependencies
# build optimized here, so Wasmi builds without its debug assertions.
[profile.dev.package.wasmi]
debug-assertions = false

[profile.release]
lto = "thin"
codegen-units = 1

[profile.wasm-release]
inherits = "release"
opt-level = "s"
debug = 0
strip = "debuginfo"
