[workspace]
members = ["rust/wasm-component-model-polyfill", "rust/wcmp-macros"]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["The Wasm Component Model Polyfill Authors"]
license = "MIT OR Apache-2.0"
edition = "2024"
repository = "https://github.com/cdata/wasm-component-model-polyfill"

[workspace.dependencies]
anyhow = "1"
console_error_panic_hook = "0.1"
futures = "0.3"
js-sys = "0.3"
proc-macro2 = "1"
quote = "1"
semver = "1"
syn = { version = "2", features = ["full"] }
thiserror = "2"
tokio = "1"
tracing = "0.1"
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
wasm_runtime_layer = "0.7"
wasmparser = "0.248"
wasmtime = "44"
wasmtime_runtime_layer = "44"
js_wasm_runtime_layer = "0.7"
wat = "1"
web-sys = "0.3"

[workspace.dependencies.wasm-component-model-polyfill]
path = "./rust/wasm-component-model-polyfill"

[workspace.dependencies.wcmp-macros]
path = "./rust/wcmp-macros"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[profile.wasm-release]
inherits = "release"
opt-level = "s"
debug = 0
strip = "debuginfo"
